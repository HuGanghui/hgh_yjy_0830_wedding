name: Deploy to GitHub Pages

# 每当推送到 main 分支时，把已提交的 public/ 目录部署到 GitHub Pages。
# 注意：不在 CI 里执行 `npm run build` —— config.json 含答案（密钥）、按设计不入库，
#       CI 里没有它无法重建。所以约定「本地 npm run build → 提交产物 → push → 自动上线」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 大小写校验：GitHub Pages 是区分大小写的服务器，而本地 macOS 的 git
      # 默认 core.ignorecase=true，可能把小写文件名按大写提交（曾导致照片 404）。
      # 这里在 Linux runner 上核对 data.json 每个 photo 路径都能按原样找到。
      - name: Verify media paths are case-exact
        run: node -e "
          const fs=require('fs'),path=require('path');
          const d=JSON.parse(fs.readFileSync('public/data.json','utf-8'));
          const bad=[];
          for(const [id,e] of Object.entries(d)){
            if(!e.photo) continue;
            const p=path.join('public',e.photo);
            const dir=path.dirname(p), base=path.basename(p);
            if(!fs.existsSync(dir) || !fs.readdirSync(dir).includes(base)) bad.push(id+': '+e.photo);
          }
          if(bad.length){ console.error('❌ 照片路径与文件大小写不一致: '+bad.join('; ')); process.exit(1); }
          console.log('✅ '+Object.keys(d).length+' 个条目的照片路径全部与文件一致');
          "

      - name: Upload public/
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
